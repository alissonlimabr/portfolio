<!-- Sidenav -->
<div class="navbar">
  <!-- Tollbar desktop + nav links -->
  <mat-toolbar>
    <span class="logo">
      <fa-icon [icon]="faCode"></fa-icon>
      <a routerLink="/">ALISSONLIMADEV</a>
      @if (isBlogRoute) {
        <span class="logo-context">/ blog</span>
      }
    </span>
    <span class="nav-links">
      @if (isBlogRoute) {
        <ul>
          <li>
            <a
              class="link"
              routerLink="/blog"
              routerLinkActive="link--active"
              [routerLinkActiveOptions]="{ exact: true }"
            >Posts</a>
          </li>
          <li>
            <a
              class="link"
              routerLink="/blog/categorias"
              routerLinkActive="link--active"
            >Categorias</a>
          </li>
          <li>
            <a class="link" href="/#sobre">Sobre</a>
          </li>
          <li>
            <a class="link" href="/#contato">Contato</a>
          </li>
          <li>
            <a
              class="link link--rss"
              href="/rss.xml"
              target="_blank"
              rel="noopener noreferrer"
              aria-label="RSS feed"
              title="RSS feed"
            >
              <svg viewBox="0 0 24 24" width="16" height="16" fill="currentColor" aria-hidden="true">
                <path d="M6.18 17.82a2.18 2.18 0 0 1-4.36 0 2.18 2.18 0 0 1 4.36 0M4 4.44A15.56 15.56 0 0 1 19.56 20h-2.83A12.73 12.73 0 0 0 4 7.27V4.44m0 5.66a9.9 9.9 0 0 1 9.9 9.9h-2.83A7.07 7.07 0 0 0 4 12.93V10.1Z"/>
              </svg>
            </a>
          </li>
          <li>
            <a class="link link--back" routerLink="/">← Portfólio</a>
          </li>
        </ul>
      } @else {
        <ul>
          <li>
            <a class="link" href="/#perfil" [class.link--section-active]="isPortfolioLinkActive('perfil')">Perfil</a>
          </li>
          <li>
            <a class="link" href="/#sobre" [class.link--section-active]="isPortfolioLinkActive('sobre')">Sobre mim</a>
          </li>
          <li>
            <a class="link" href="/#habilidades" [class.link--section-active]="isPortfolioLinkActive('habilidades')">Habilidades</a>
          </li>
          <li>
            <a class="link" href="/#trabalhos" [class.link--section-active]="isPortfolioLinkActive('trabalhos')">Trabalhos</a>
          </li>
          <li>
            <a class="link" href="/#projetos" [class.link--section-active]="isPortfolioLinkActive('projetos')">Projetos</a>
          </li>
          <li>
            <a class="link" href="/#contato" [class.link--section-active]="isPortfolioLinkActive('contato')">Contato</a>
          </li>
          <li>
            <a class="link" routerLink="/blog" routerLinkActive="link--active">Blog</a>
          </li>
        </ul>
      }
    </span>
    <!-- Sidenav button open -->
    <button
      class="menu"
      mat-icon-button
      matTooltip="Basic"
      aria-label="menu"
      (click)="openSidenav.emit()"
    >
      <fa-icon [icon]="faBars"></fa-icon>
    </button>
  </mat-toolbar>
</div>
