<section class="not-found">
  <span class="not-found-tag">[ 404 ] ERRO</span>

  <div class="not-found-code" aria-hidden="true">404</div>

  <h1>Página não encontrada</h1>
  <p class="not-found-text">
    O endereço que você tentou acessar não existe, foi movido ou nunca foi publicado.
  </p>

  <div class="not-found-request" aria-hidden="true">
    <div class="not-found-request-bar">
      <span class="not-found-request-dots"><i></i><i></i><i></i></span>
      requisição
    </div>
    <div class="not-found-request-body">
      @if (path) {
      <p><span class="not-found-method">GET</span> {{ path }}</p>
      <p><span class="not-found-status">404</span> Not Found <span class="not-found-comment">// página inexistente</span></p>
      }
    </div>
  </div>

  <div class="not-found-actions">
    <a class="not-found-link not-found-link--primary" routerLink="/">Voltar ao portfólio</a>
    <a class="not-found-link" routerLink="/blog">Ir para o blog</a>
  </div>
</section>
